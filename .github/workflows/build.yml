name: Build AutoClicker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang git libssl-dev pkg-config zlib1g-dev make

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Build Project
        run: |
          export THEOS=~/theos
          make package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Package
          path: packages/*.deb
