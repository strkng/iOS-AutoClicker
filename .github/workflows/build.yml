name: Build AutoClicker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rabisense/theos:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build with Theos
        run: |
          make package

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Package
          path: packages/*.deb
