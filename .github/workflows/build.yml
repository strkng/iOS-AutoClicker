name: Build iOS dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          if [ ! -d "$HOME/theos/sdks" ]; then
            git clone https://github.com/theos/sdks.git ~/theos/sdks
          else
            echo "SDKs directory already exists, skipping clone."
          fi

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Tweak (Compile only)
        env:
          THEOS: /Users/runner/theos
        run: |
          # パッケージ化(make package)ではなく、コンパイルのみ(make)を実行して余計な自動署名を避ける
          make

      - name: Properly Re-sign the generated dylib
        run: |
          echo "=== Applying clean ad-hoc signature with ldid ==="
          # 生成されたすべてのdylibに対して、余計なオプションを排除して純粋なアドホック署名を付与
          find . -name "*.dylib" -exec ldid -S {} \;
          
          # 署名が正しく付与されたか確認
          find . -name "*.dylib" -exec ldid -v {} \;

      - name: Prepare dylib Artifact
        run: |
          mkdir -p output_files
          find . -name "*.dylib" -exec cp {} output_files/ \;
          find . -name "*.plist" -exec cp {} output_files/ \;
          echo "=== Collected files ==="
          ls -la output_files/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-dylib
          path: output_files/*
