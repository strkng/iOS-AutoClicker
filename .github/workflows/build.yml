name: Build iOS dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          if [ ! -d "$HOME/theos/sdks" ]; then
            git clone https://github.com/theos/sdks.git ~/theos/sdks
          else
            echo "SDKs directory already exists, skipping clone."
          fi

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Tweak (.dylib)
        env:
          THEOS: /Users/runner/theos
        run: |
          make package

      - name: Re-sign dylib properly with ldid
        run: |
          # コード署名エラー（code signature invalid）を防ぐため、生成されたdylibにAd-hoc署名を正しく再適用する
          find . -name "*.dylib" -exec ldid -S {} \;

      - name: Prepare dylib Artifact
        run: |
          mkdir -p output_files
          find . -name "*.dylib" -exec cp {} output_files/ \;
          find . -name "*.plist" -exec cp {} output_files/ \;
          echo "=== Collected files ==="
          ls -la output_files/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-dylib
          path: output_files/*
