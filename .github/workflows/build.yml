name: Build iOS dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          if [ ! -d "$HOME/theos/sdks" ]; then
            git clone https://github.com/theos/sdks.git ~/theos/sdks
          else
            echo "SDKs directory already exists, skipping clone."
          fi

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Tweak (Compile only)
        env:
          THEOS: /Users/runner/theos
        run: |
          # パッケージ化(make package)を行わず、Makefileで指定したarm64のみでコンパイル
          make

      - name: Force Clean Ad-hoc Signature
        run: |
          echo "=== Re-signing dylib with strict ad-hoc flag ==="
          # 生成されたすべてのdylibに対して、最新のldidでクリーンなアドホック署名を強制適用
          find . -name "*.dylib" -exec ldid -S {} \;
          
          # 署名の検証
          find . -name "*.dylib" -exec ldid -v {} \;

      - name: Prepare dylib Artifact
        run: |
          mkdir -p output_files
          find . -name "*.dylib" -exec cp {} output_files/ \;
          find . -name "*.plist" -exec cp {} output_files/ \;
          echo "=== Collected files ==="
          ls -la output_files/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-dylib
          path: output_files/*
