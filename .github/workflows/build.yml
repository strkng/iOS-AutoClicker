name: Build Theos Project

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rabisense/theos:latest # または使用しているtheos環境のコンテナ

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Project
        run: make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Framework
          path: packages/*.deb # またはビルドされた.framework / .ipa の出力先パス
